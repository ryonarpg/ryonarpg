<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RyonaRPG 日文wiki 汉化版</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="../css/default.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<a href="../index.html">RyonaRPG 日文wiki 汉化版</a>',
      repo: 'https://github.com/ryonarpg/ryonarpg',
      loadSidebar: true,
      mergeNavbar: true,
      subMaxLevel: 4,
      loadNavbar: true,
      auto2top: true,
      homepage: 'README.md',
      timeUpdater: {
        text: "<div align='center' width='200px' style='color:gray;font-size:15px'>-------------- 最后更新时间:&emsp;{docsify-updated} --------------</div>",
        formatUpdated: "{YYYY}/{MM}/{DD}",
        whereToPlace: "top"
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '输入内容检索',
        noData: '未检索到结果',
        depth: 1,
        hideOtherSidebarContent: false
      },
      pagination: {
        previousText: '上一章节',
        nextText: {
          '/': '下一章节'
        },
        crossChapter: true,
        crossChapterText: true
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
